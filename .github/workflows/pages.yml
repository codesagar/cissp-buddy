name: Validate and publish CISSP Buddy
on:
  push:
    branches: [main, codex/static-pages, codex/personal-cloud, codex/learning-refinement, codex/minimal-ui, codex/google-first, codex/settings-cleanup]
  pull_request:
    branches: [main, codex/static-pages, codex/personal-cloud, codex/learning-refinement, codex/minimal-ui, codex/google-first, codex/settings-cleanup]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:cloud
      - run: npm run qa:final
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build for the configured Pages address
        env:
          CISSP_BASE_PATH: '${{ steps.pages.outputs.base_path }}/'
        run: npm run build
      - name: Verify the exact Pages output
        env:
          CISSP_BASE_PATH: '${{ steps.pages.outputs.base_path }}/'
        run: node --experimental-strip-types scripts/verify-static-output.mjs --base="$CISSP_BASE_PATH"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/static-pages'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static output
        id: deployment
        uses: actions/deploy-pages@v5.0.1
